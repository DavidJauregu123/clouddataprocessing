<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MapReduce Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 2rem; }

    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem; color: #f8fafc; }
    p.sub { text-align: center; color: #94a3b8; margin-bottom: 2rem; }

    .input-row { display: flex; gap: 0.75rem; max-width: 700px; margin: 0 auto 2.5rem; }
    input[type=url] {
      flex: 1; padding: 0.75rem 1rem; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
      background: #6366f1; color: white; font-size: 1rem; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #334155; cursor: not-allowed; }

    .stats { text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
    .stats span { color: #a5b4fc; font-weight: 600; }

    .phases { display: flex; flex-direction: column; gap: 1.5rem; }
    .phase { background: #1e293b; border-radius: 12px; padding: 1.25rem; border: 1px solid #334155; opacity: 0; transform: translateY(12px); transition: opacity 0.4s, transform 0.4s; }
    .phase.visible { opacity: 1; transform: translateY(0); }

    .phase-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1rem; }
    .map-title   { color: #34d399; }
    .shuffle-title { color: #fbbf24; }
    .reduce-title  { color: #60a5fa; }

    .workers { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .worker {
      flex: 1; min-width: 160px; background: #0f172a; border-radius: 8px;
      padding: 0.75rem; border: 1px solid #1e3a2f;
    }
    .worker-label { font-size: 0.7rem; color: #34d399; font-weight: 700; margin-bottom: 0.5rem; }
    .worker-total { font-size: 0.75rem; color: #64748b; margin-bottom: 0.5rem; }
    .pair { font-size: 0.78rem; color: #a7f3d0; padding: 2px 0; }
    .pair .word { color: #f1f5f9; font-weight: 600; }

    .shuffle-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .shuffle-item {
      background: #0f172a; border-radius: 6px; padding: 0.4rem 0.75rem;
      border: 1px solid #3f3001; font-size: 0.8rem;
    }
    .shuffle-item .skey { color: #fbbf24; font-weight: 700; }
    .shuffle-item .sval { color: #94a3b8; }

    .bars { display: flex; flex-direction: column; gap: 0.4rem; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; }
    .bar-label { width: 130px; font-size: 0.8rem; color: #f1f5f9; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #0f172a; border-radius: 4px; height: 20px; }
    .bar-fill { height: 100%; border-radius: 4px; background: #3b82f6; transition: width 0.6s ease; }
    .bar-count { font-size: 0.75rem; color: #60a5fa; width: 36px; }

    .error { color: #f87171; text-align: center; margin-top: 1rem; }
    #spinner { display: none; text-align: center; color: #94a3b8; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>MapReduce Demo</h1>
  <p class="sub">Ingresa la URL de cualquier página y ve cómo MapReduce cuenta sus palabras</p>

  <div class="input-row">
    <input type="url" id="urlInput" placeholder="https://es.wikipedia.org/wiki/Python" />
    <button id="btn" onclick="run()">Analizar</button>
  </div>

  <div id="spinner">Procesando...</div>
  <div id="error" class="error"></div>
  <div id="stats" class="stats"></div>
  <div id="phases" class="phases"></div>

  <script>
    async function run() {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) return;

      const btn = document.getElementById("btn");
      btn.disabled = true;
      document.getElementById("spinner").style.display = "block";
      document.getElementById("error").textContent = "";
      document.getElementById("stats").textContent = "";
      document.getElementById("phases").innerHTML = "";

      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        render(data);
      } catch (e) {
        document.getElementById("error").textContent = "Error: " + e.message;
      } finally {
        btn.disabled = false;
        document.getElementById("spinner").style.display = "none";
      }
    }

    function render(data) {
      document.getElementById("stats").innerHTML =
        `Palabras totales: <span>${data.word_count.toLocaleString()}</span> &nbsp;|&nbsp; Palabras únicas: <span>${data.unique_words.toLocaleString()}</span>`;

      const container = document.getElementById("phases");
      const maxCount = Math.max(...Object.values(data.reduce));

      const phases = [
        { title: "MAP — Workers etiquetan palabras", cls: "map-title",    html: renderMap(data.map) },
        { title: "SHUFFLE — Sistema agrupa por palabra", cls: "shuffle-title", html: renderShuffle(data.shuffle) },
        { title: "REDUCE — Conteo final (Top 20)", cls: "reduce-title",   html: renderReduce(data.reduce, maxCount) },
      ];

      phases.forEach(({ title, cls, html }, i) => {
        const div = document.createElement("div");
        div.className = "phase";
        div.innerHTML = `<div class="phase-title ${cls}">${title}</div>${html}`;
        container.appendChild(div);
        setTimeout(() => div.classList.add("visible"), i * 300);
      });
    }

    function renderMap(mapData) {
      return `<div class="workers">${mapData.map(w => `
        <div class="worker">
          <div class="worker-label">Worker ${w.worker}</div>
          <div class="worker-total">${w.total.toLocaleString()} palabras etiquetadas</div>
          ${w.sample.map(([word]) => `<div class="pair">→ <span class="word">${word}</span>, 1</div>`).join("")}
          <div class="pair" style="color:#475569">... y más</div>
        </div>`).join("")}</div>`;
    }

    function renderShuffle(shuffle) {
      return `<div class="shuffle-grid">${Object.entries(shuffle).map(([k, v]) => `
        <div class="shuffle-item">
          <span class="skey">${k}</span>
          <span class="sval"> → [${v.join(", ")}] = ${v.length}</span>
        </div>`).join("")}
        <div class="shuffle-item" style="color:#475569">... todas las palabras únicas agrupadas</div>
      </div>`;
    }

    function renderReduce(reduce, max) {
      return `<div class="bars">${Object.entries(reduce).map(([word, count]) => `
        <div class="bar-row">
          <div class="bar-label">${word}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(count/max*100)}%"></div>
          </div>
          <div class="bar-count">${count}</div>
        </div>`).join("")}</div>`;
    }

    document.getElementById("urlInput").addEventListener("keydown", e => {
      if (e.key === "Enter") run();
    });
  </script>
</body>
</html>
